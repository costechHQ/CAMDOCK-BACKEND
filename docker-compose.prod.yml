# Production overrides. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# See backend/docs/DEPLOYMENT.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    restart: unless-stopped
    ports: !reset []
    logging: *logging

  api:
    restart: unless-stopped
    ports: !reset []
    logging: *logging
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Only the proxy below may say who the real client is (X-Forwarded-For). Its address
      # is fixed on a private network; change PROXY_SUBNET and PROXY_IP in .env together
      # if 172.28.0.0/24 is already in use on the server.
      TRUSTED_PROXIES: ${PROXY_IP:-172.28.0.10}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env (a domain name)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.28.0.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.28.0.0/24}

volumes:
  caddy_data:
