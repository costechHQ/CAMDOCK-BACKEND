name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, migrations, tests, security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: camdock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The database name ends in _test, which the test suite requires.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-throwaway@127.0.0.1:5432/camdock_test
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-throwaway@127.0.0.1:5432/camdock_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint (includes security rules)
        run: uv run ruff check
      - name: Formatting
        run: uv run ruff format --check
      - name: Create the schema on an empty database
        run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: Known vulnerabilities in the locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --hashes > "$RUNNER_TEMP/runtime-requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --require-hashes --disable-pip --no-deps

  image:
    name: Production image and stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway settings
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SITE_ADDRESS=:80"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
          } > .env
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Start the production stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - name: Not ready until migrated, then ready through the proxy
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/health/ready)" = 503
          docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm api alembic upgrade head
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready
      - name: Production hardening is in effect
        run: |
          headers="$(curl -sSi http://127.0.0.1:8080/api/v1/public/stats)"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-request-id:'
          ! echo "$headers" | grep -qi '^server:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = 404
      - name: Load reference data and create a throwaway administrator
        run: |
          dc="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ACCEPTANCE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          $dc run --rm api python -m app.db.seed \
            --academic-year 2026/2027 --start-date 2026-09-07 --end-date 2027-07-23 --current
          $dc run --rm -e CAMDOCK_ADMIN_PASSWORD="$password" api \
            python -m app.cli create-admin --email acceptance@ci.example
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
      - name: Install the acceptance script's dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: SRS acceptance criteria against the production stack
        working-directory: backend
        run: |
          uv run python scripts/acceptance_run.py \
            --base-url http://127.0.0.1:8080 \
            --admin-email acceptance@ci.example \
            --confirm-writes
      - name: Show logs if something failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 100
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
